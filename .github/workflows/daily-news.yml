name: 每日新闻更新

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00（GitHub Actions 可能延后几分钟）
    - cron: '0 0 * * *'
    # 冗余第二枪：北京时间 14:30 再跑一次，覆盖单次定时漏跑
    - cron: '30 6 * * *'
  workflow_dispatch:          # 允许在 Actions 页面手动点一下补跑

# 防止两枪重叠
concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成今日新闻
        run: node scripts/gen-news.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json version.json
          git diff --cached --quiet || git commit -m "每日新闻自动更新 $(date +'%Y-%m-%d')"
          git push
