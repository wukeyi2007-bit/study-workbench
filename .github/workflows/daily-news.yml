name: 每日新闻更新

on:
  schedule:
    # 全部错开整点，避开 GitHub 排队高峰；5 枪任意一枪跑成即更新
    # 北京时间 = UTC + 8
    - cron: '17 23 * * *'   # 北京 07:17
    - cron: '43 0 * * *'    # 北京 08:43
    - cron: '21 2 * * *'    # 北京 10:21
    - cron: '37 4 * * *'    # 北京 12:37
    - cron: '11 7 * * *'    # 北京 15:11
  workflow_dispatch:

concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成今日新闻
        run: node scripts/gen-news.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json version.json
          git diff --cached --quiet && echo "内容无变化，跳过提交" && exit 0
          git commit -m "每日新闻自动更新 $(date +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push origin main

