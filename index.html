  <script>
  // 根据用户当前主题动态生成 PWA manifest，让启动屏顶部状态栏随主题色变化
  (function(){
    try {
      var state = JSON.parse(localStorage.getItem('keyi_state') || '{}');
      var settings = state.settings || {};
      var key = settings.theme || 'amber';
      var custom = settings.customAccent;
      var map = {amber:'#f59e0b', rose:'#ec4899', mint:'#10b981', sky:'#0ea5e9', violet:'#8b5cf6', emerald:'#22c55e'};
      var primary = (key === 'custom' && custom) ? custom : (map[key] || map.amber);
      function shadeHex(hex, p){
        var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
        var f=1+p/100;
        r=Math.max(0,Math.min(255,Math.round(r*f)));
        g=Math.max(0,Math.min(255,Math.round(g*f)));
        b=Math.max(0,Math.min(255,Math.round(b*f)));
        return '#'+[r,g,b].map(function(x){return x.toString(16).padStart(2,'0');}).join('');
      }
      var themeColor = shadeHex(primary, -22);
      var manifest = {
        "name":"KeYi",
        "short_name":"KeYi",
        "description":"英语四级 + 锻炼 + 理财 一站式学习工作台",
        "lang":"zh-CN",
        "start_url":"./index.html",
        "scope":"./",
        "display":"standalone",
        "orientation":"portrait",
        "background_color":"#fffbeb",
        "theme_color": themeColor,
        "categories":["education","productivity"],
        "icons":[
          {"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
          {"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"},
          {"src":"icon-maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
        ]
      };
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    } catch(e) {
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.json';
      document.head.appendChild(link);
    }
  })();
  </script>
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
  // 启动即自检线上最新版本：发现与本地不一致则自动强制刷新，避免浏览器缓存旧页面
  (function(){
    try{
      fetch('version.json?_='+Date.now(),{cache:'no-store'})
        .then(function(r){return r.json();})
        .then(function(d){
          if(!d || !d.v) return;
          var cur = localStorage.getItem('app_version') || '';
          if(!cur){ localStorage.setItem('app_version', d.v); }
          else if(d.v !== cur){ localStorage.setItem('app_version', d.v); location.reload(); }
        })
        .catch(function(){});
    }catch(e){}
  })();
  // 捕获 PWA 安装提示事件（若浏览器支持）
  var deferredPrompt;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    try { localStorage.setItem('pwa_install_available', '1'); } catch(err){}
  });
  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    try { localStorage.setItem('pwa_install_available', '0'); } catch(err){}
  });
  // 注册 Service Worker：让网站能「安装到手机主屏幕」并离线使用
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        // 检测到新版本 SW 时立即接管，防止旧缓存导致更新不生效
        reg.addEventListener('updatefound', function(){
          var newSw = reg.installing;
          if(newSw){
            newSw.addEventListener('statechange', function(){
              if(newSw.state === 'installed' && navigator.serviceWorker.controller){
                location.reload();
              }
            });
          }
        });
      }).catch(function(){});
    });
  }
  </script>
